# DC idea engine — all tunables live here.
# Any change to this file or to scanner/ is a new engine version: bump engine.version and add an
# entry to engines.json in the same commit (python tools/release_engine.py does both). The tag
# engine-v<version> is created automatically on push to main and freezes code + config + weights.

engine:
  version: "2.0"

universe:
  min_market_cap: 2.0e+9        # USD
  min_avg_volume: 300000        # 30D average shares; drops illiquid names
  exchanges: [NYSE, NASDAQ, AMEX]
  min_history_sessions: 250     # excludes recent IPOs (no reliable 200D)
  max_ann_vol_pct: 80           # 63D annualised vol cap; keeps pair legs balanceable
  min_ann_vol_pct: 12           # below this = pinned by a takeover bid, not a setup

data:
  history_sessions: 820         # ~3.2 years: 2Y weekly chart + 40W/52W warm-up + learning history

selection:
  quota_per_side_per_sector: 6  # charts per sector/side (11 sectors x 2 sides x 6 = 132 max)

# Step 1 — long timeframe (weekly). Only names whose weekly picture agrees with the side go on.
gate:
  long: [Uptrend, Turning up]
  short: [Downtrend, Turning down]

# RS Line - Blue Dot (Dean's Pine script), run on weekly bars.
rs:
  scale: 100
  ma_len: 40                    # 40W ~ 200D
  ma_type: SMA
  hl_len: 52                    # blue/red dots = 52-week RS high/low
  cross_lookback_weeks: 8       # an RS/MA cross counts as "recent" for this many weeks
  dot_lookback_weeks: 4         # a blue/red dot counts as recent for this many weeks
  lead_price_far_pct: 10        # RS-leads-price: price still up to 10% short of its 40W MA...
  lead_price_near_pct: 3        # ...or at most 3% through it

# Stock vs its own sector ETF, RRG-style (Leading / Improving / Weakening / Lagging).
sector_rotation:
  smooth_len: 5                 # 5D EMA of the stock/sector ratio, to stop day-to-day flicker
  trend_len: 50                 # relative trend = smoothed ratio vs its 50D average
  mom_len: 10                   # relative momentum = change of that over 10 sessions
  turn_recent_days: 10          # "just turned Leading/Lagging" window

# Step 2 — daily setups (Dean's guide).
strategies:
  s1:
    mode: follow                # follow = trade the thrust direction; fade = inverse it
  s2:
    perf_field: p3m             # p3m or p1m
    leader_pct: 0.80
    laggard_pct: 0.20
  s3:
    band_pct: 3.0               # |distance from 200D| <= this
    min_r2: 0.55                # "straight picture" requirement
  mom:
    leader_pct: 0.80
    laggard_pct: 0.20

# Step 3 — short-term triggers on the 6M / 3M window.
triggers:
  breakout_exclude_days: 5      # resistance/support = 3M or 6M range high/low, excluding the last week
  breakout_recent_days: 5       # breakout must have happened within this many sessions and still hold
  breakout_volume_ratio: 1.5    # volume vs 50D average on the breakout days for the "confirmed" bonus
  macd_recent_days: 3           # MACD histogram flip / turn within this many sessions

learning:
  horizon: 5                    # sessions; matches the 1-week hold
  holdout_frac: 0.30            # newest 30% of dates are the out-of-sample test
  ridge_alpha: 50
  min_rows: 3000
  min_ic_gain: 0.003            # new weights must beat current ones out of sample by this much
  blend: 0.5                    # move halfway towards the fitted weights...
  max_step: 0.03                # ...but never more than this per weight per week
  pref_min_labels: 30           # Dean's-eye model switches on after this many labelled legs
  pref_C: 0.3
  pref_beta_k: 150              # beta = n / (n + k): his model's share of the ranking
  pref_beta_max: 0.5

# Fundamentals for the shortlisted candidates (Yahoo; FMP surprises if FMP_API_KEY is set; SEC EDGAR guidance).
fundamentals:
  enabled: true
  basket_per_sector: 20         # largest names per supersector form the sector reference basket
  workers: 6
  news_days: 21
  news_max: 6
  guidance: true
  guidance_days: 120            # latest earnings release (8-K item 2.02, exhibit 99) within this window
  sec_user_agent: "dc-idea-engine research bot pergolesi099@users.noreply.github.com"

charts:
  weekly_bars: 104              # 2 years
  daily_bars: 252               # 1 year
  daily_rs_ma: 200              # MA on the daily RS line (Kabbaj's original 200)
