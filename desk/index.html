<title>Idea Conveyor belt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800&family=Chivo+Mono:wght@400;500&display=swap">
<style>
/* Layout: desk header -> tab strip -> filter row -> two-column pair tickets (one column on phones); long leg left, short leg right */
:root {
  --bg: #f3f5f3; --surface: #ffffff; --sunk: #e9edeb; --ink: #16201d; --muted: #5b6a65; --line: #d7dfdb;
  --long: #17805a; --long-soft: #e2f2ea; --short: #b8443a; --short-soft: #f8e6e3;
  --accent: #a86c12; --accent-soft: #f6ead6; --warn: #9a5b00; --warn-soft: #fbefd9;
  --font-display: "Chivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Chivo", "Helvetica Neue", Arial, sans-serif;
  --font-data: "Chivo Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --surface: #161e1b; --sunk: #1d2724; --ink: #e3eae7; --muted: #92a39d; --line: #283430;
  --long: #45c290; --long-soft: #173329; --short: #ef7b6f; --short-soft: #3a1f1c;
  --accent: #e2a94e; --accent-soft: #3a2c15; --warn: #f0b75a; --warn-soft: #362a12; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #161e1b; --sunk: #1d2724; --ink: #e3eae7; --muted: #92a39d; --line: #283430;
  --long: #45c290; --long-soft: #173329; --short: #ef7b6f; --short-soft: #3a1f1c;
  --accent: #e2a94e; --accent-soft: #3a2c15; --warn: #f0b75a; --warn-soft: #362a12; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* header */
header.desk { display: grid; gap: 10px; }
.brandrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; justify-content: space-between; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3vw, 30px); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.runpick { display: flex; align-items: center; gap: 8px; }
.runpick select { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 5px 8px; max-width: 100%; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-width: 0; }
.runbtn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: var(--r); padding: 5px 12px; cursor: pointer; font-weight: 700; white-space: nowrap; }
.runbtn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); font-weight: 500; }
.runbtn:disabled { opacity: .55; cursor: not-allowed; }
.enginechip { font-family: var(--font-data); font-size: 12px; padding: 1px 7px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.enginenote { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; color: var(--muted); font-size: 13px; max-width: 100ch; }
.enginenote b { color: var(--ink); font-weight: 500; }
.cycle { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; font-size: 13px; }
.cycle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.cycle.done .dot { background: var(--long); }
.cycle.failed { border-color: var(--short); }
.cycle.failed .dot { background: var(--short); }
.cycle .x { margin-left: auto; padding: 2px 8px; font-size: 12px; }
@media (prefers-reduced-motion: no-preference) { .cycle.live .dot { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .3; } }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 500; }
.note { max-width: 78ch; margin: 0; color: var(--ink); }

/* tabs + filters */
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.count { font-family: var(--font-data); font-size: 12px; margin-left: 6px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

/* pair ticket */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 14px; align-items: start; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 0; min-width: 0; }
.ticket.is-pass { opacity: .55; }
.thead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 14px 0; }
.sector { font-weight: 700; }
.badge { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--sunk); color: var(--muted); }
.pips { display: inline-flex; gap: 3px; margin-left: auto; align-items: center; }
.pips i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.pips i.on { background: var(--accent); }
.status { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.status.take { background: var(--long-soft); color: var(--long); }
.status.watch { background: var(--accent-soft); color: var(--accent); }
.status.pass { background: var(--sunk); color: var(--muted); }
.thesis { padding: 6px 14px 10px; margin: 0; max-width: 75ch; }
.legs { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.leg { padding: 10px 14px; display: grid; gap: 7px; min-width: 0; align-content: start; }
.leg + .leg { border-left: 1px solid var(--line); }
.legtop { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.side { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; }
.side.long { color: var(--long); background: var(--long-soft); }
.side.short { color: var(--short); background: var(--short-soft); }
.tkr { font-family: var(--font-data); font-weight: 500; font-size: 18px; }
.grade { font-family: var(--font-data); font-size: 12px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.co { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thumb { display: block; width: 100%; aspect-ratio: 11 / 7; max-width: 100%; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 4px; background: var(--sunk); cursor: zoom-in; padding: 0; }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; border-radius: 3px; }
.read { font-size: 13px; margin: 0; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 8px; font-size: 12px; }
.stats div { display: flex; justify-content: space-between; gap: 4px; }
.stats span:first-child { color: var(--muted); }
.pos { color: var(--long); } .neg { color: var(--short); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-family: var(--font-data); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--muted); }
.earn { font-size: 12px; color: var(--muted); }
.earn.soon { color: var(--warn); background: var(--warn-soft); padding: 1px 6px; border-radius: 3px; width: fit-content; }
.pairstats { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pairstats b { color: var(--ink); font-weight: 500; }
.decide { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--sunk); border-radius: 0 0 var(--r) var(--r); }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 12px; cursor: pointer; font-weight: 500; }
.act[aria-pressed="true"][data-a="take"] { background: var(--long); border-color: var(--long); color: var(--surface); }
.act[aria-pressed="true"][data-a="watch"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.act[aria-pressed="true"][data-a="pass"] { background: var(--muted); border-color: var(--muted); color: var(--surface); }
.act:disabled { opacity: .5; cursor: not-allowed; }
.decide select, .decide input { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 5px 8px; min-width: 0; }
.decide input { flex: 1 1 160px; }
.saved { font-size: 12px; color: var(--muted); margin-left: auto; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.bdg { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.bdg.up { background: var(--long-soft); color: var(--long); }
.bdg.dn { background: var(--short-soft); color: var(--short); }
.bdg.turn { background: var(--accent-soft); color: var(--accent); }
.fbrow { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.fb { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 12px; }
.fb[aria-pressed="true"][data-v="good"] { background: var(--long); border-color: var(--long); color: var(--surface); }
.fb[aria-pressed="true"][data-v="bad"] { background: var(--short); border-color: var(--short); color: var(--surface); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; }
.kpi b { font-family: var(--font-data); font-size: 20px; font-weight: 500; }
.bar { height: 6px; background: var(--sunk); border-radius: 3px; position: relative; min-width: 80px; }
.bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.learn { display: grid; gap: 16px; max-width: 900px; }
.learn p { margin: 0; max-width: 75ch; }

/* gallery */
.sectorblock { display: grid; gap: 8px; }
.sectorblock h2 { font-size: 15px; margin: 6px 0 0; }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px; display: grid; gap: 6px; min-width: 0; }

/* book */
.book { display: grid; gap: 14px; max-width: 760px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 12px; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
textarea.copyout { width: 100%; min-height: 90px; font-family: var(--font-data); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }

/* states */
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 20px; color: var(--muted); max-width: 70ch; }
.empty b { color: var(--ink); }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 8px 12px; }

/* lightbox */
dialog.lb { border: 0; padding: 0; background: transparent; max-width: min(1120px, 96vw); width: 100%; }
dialog.lb::backdrop { background: rgb(0 0 0 / .72); }
.lbinner { background: var(--surface); border-radius: var(--r); padding: 10px; display: grid; gap: 8px; }
.lbinner img { width: 100%; height: auto; border-radius: 4px; }
.lbbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 4px 10px; cursor: pointer; }

@media (max-width: 640px) {
  .legs { grid-template-columns: 1fr; }
  .leg + .leg { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: no-preference) { .ticket { transition: opacity .2s ease; } }
</style>

<div class="wrap">
  <header class="desk">
    <div class="brandrow">
      <h1>DC Idea Desk</h1>
      <div class="controls">
        <div class="runpick"><label class="lbl" for="engine">Engine</label><select id="engine" disabled><option>Loading…</option></select></div>
        <div class="runpick"><label class="lbl" for="run">Scan</label><select id="run" disabled><option>Loading…</option></select></div>
        <div class="runpick" id="runctl"><button class="runbtn" id="runscan" disabled>Run new scan</button></div>
      </div>
    </div>
    <div class="enginenote" id="enginenote" hidden></div>
    <div class="facts" id="facts"></div>
    <p class="note" id="note"></p>
  </header>

  <div id="cycle" class="cycle" hidden aria-live="polite"></div>
  <div id="banner" class="banner" hidden></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-pairs" aria-selected="true" data-tab="pairs">Pairs<span class="count" id="c-pairs"></span></button>
    <button role="tab" id="tab-charts" aria-selected="false" data-tab="charts">All charts<span class="count" id="c-charts"></span></button>
    <button role="tab" id="tab-book" aria-selected="false" data-tab="book">Book<span class="count" id="c-book"></span></button>
    <button role="tab" id="tab-track" aria-selected="false" data-tab="track">Track record<span class="count" id="c-track"></span></button>
    <button role="tab" id="tab-learn" aria-selected="false" data-tab="learn">Learning</button>
  </nav>

  <section id="view-pairs">
    <div class="filters" id="pairfilters"></div>
    <div class="grid" id="pairs" style="margin-top:12px"></div>
  </section>
  <section id="view-charts" hidden>
    <div class="filters" id="chartfilters"></div>
    <div id="charts" style="display:grid;gap:14px;margin-top:12px"></div>
  </section>
  <section id="view-book" hidden>
    <div class="book" id="book"></div>
  </section>
  <section id="view-track" hidden>
    <div class="book" id="track" style="max-width:980px"></div>
  </section>
  <section id="view-learn" hidden>
    <div class="learn" id="learn"></div>
  </section>
</div>

<dialog class="lb" id="lb">
  <div class="lbinner">
    <div class="lbbar"><span id="lbtitle" class="mono"></span><button class="x" id="lbclose">Close</button></div>
    <img id="lbimg" alt="">
    <p id="lbread" class="read"></p>
  </div>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v, d = 1) => v == null ? "–" : `<span class="${v >= 0 ? "pos" : "neg"}">${v >= 0 ? "+" : ""}${Number(v).toFixed(d)}%</span>`;
const REASONS = { pass: ["Long leg weak", "Short leg weak", "Both charts weak", "Already extended", "Bad pair fit", "Earnings risk", "No catalyst", "Crowded / consensus", "Other"],
                  watch: ["Wait for pullback", "Wait for breakout", "Wait for earnings", "Other"] };

const S = { db: null, user: null, uid: null, canWrite: true, runs: [], run: null, decisions: {}, unsub: null, chartfb: {}, unsub2: null,
            tab: "pairs", fSector: "All", fConv: 0, fHide: false, gSide: "all", gGrade: "all",
            mcp: null, engines: [], engine: "all", allRuns: [], cycle: null, myCycle: null, arm: false, busy: false };
try { const t = localStorage.getItem("desk.tab"); if (t) S.tab = t; } catch (e) {}
try { const g = localStorage.getItem("desk.engine"); if (g) S.engine = g; } catch (e) {}
const REVIEW_TASK = "trig_01GBb5aagGJvJdSW6U8WtLGm";   // the "DC Idea Desk - REVIEW" scheduled task
const engOf = r => String(r?.engine || "2.0");
const vkey = v => String(v).split(".").map(n => String(n).padStart(4, "0")).join(".");
const ACTIVE = ["requested", "scanning", "reviewing"];

function showBanner(msg) { const b = $("#banner"); b.textContent = msg; b.hidden = !msg; }

/* ---------- boot ---------- */
renderEmpty("Loading the latest scan…");
(async () => {
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n) : Promise.resolve(null);
  const db = await use("db");
  if (!db) { renderEmpty("Sign in to claude.ai to load the desk. Scans and decisions live in this page's database."); return; }
  S.db = db;
  const user = await use("user");
  S.user = user;
  if (user) {
    try { S.uid = await user.id(); } catch (e) {}
    try { const w = await user.can("data.write"); if (w === false) S.canWrite = false; } catch (e) {}
  }
  use("mcp").then(m => { S.mcp = m; renderControls(); });
  $("#run").addEventListener("change", e => selectRun(e.target.value));
  $("#engine").addEventListener("change", e => { S.engine = e.target.value; try { localStorage.setItem("desk.engine", S.engine); } catch (err) {} applyRuns(); });
  db.collection("engines").onSnapshot(snap => {
    S.engines = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    applyRuns();
  }, err => {});
  db.collection("cycles").orderBy("requested_at", "desc").limit(1).onSnapshot(snap => {
    S.cycle = snap.docs.length ? { id: snap.docs[0].id, ...snap.docs[0].data() } : null;
    renderCycle(); renderControls();
  }, err => {});
  db.collection("runs").orderBy("run_utc", "desc").limit(40).onSnapshot(snap => {
    S.allRuns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    applyRuns();
  }, err => renderEmpty("The desk could not load scans right now. Reload the page in a minute."));
})();

/* ---------- engines + scan list ---------- */
function engineList() {
  const m = {};
  S.engines.forEach(e => { m[String(e.version || e.id)] = e; });
  S.allRuns.forEach(r => { const v = engOf(r); m[v] = m[v] || { version: v }; });
  return Object.values(m).sort((a, b) => vkey(b.version).localeCompare(vkey(a.version)));
}
function currentEngine() {
  const l = engineList();
  return (l.find(e => e.current) || l[0] || { version: "2.0" }).version;
}
function applyRuns() {
  const engs = engineList();
  if (S.engine !== "all" && !engs.some(e => e.version === S.engine)) S.engine = "all";
  const cur = currentEngine();
  const esel = $("#engine");
  esel.innerHTML = `<option value="all">All engines</option>` + engs.map(e =>
    `<option value="${esc(e.version)}" ${S.engine === e.version ? "selected" : ""}>v${esc(e.version)}${e.version === cur ? " · current" : ""}</option>`).join("");
  esel.disabled = false;
  S.runs = S.allRuns.filter(r => S.engine === "all" || engOf(r) === S.engine);
  const sel = $("#run");
  if (!S.runs.length) {
    sel.innerHTML = `<option>No scans</option>`; sel.disabled = true;
    S.run = null;
    if (S.unsub) { S.unsub(); S.unsub = null; }
    if (S.unsub2) { S.unsub2(); S.unsub2 = null; }
    $("#facts").innerHTML = ""; $("#note").textContent = "";
    renderEmpty(S.allRuns.length
      ? `<b>No scans from engine v${esc(S.engine)} yet.</b> Press Run new scan to run this version on today's market, or pick another engine.`
      : "<b>No scan published yet.</b> The weekly review fills this desk on Saturday morning after the GitHub scan runs, or press Run new scan. Each run adds 15–25 pair tickets, every chart it reviewed, and a Book of the pairs you take.");
  } else {
    sel.innerHTML = S.runs.map(r => `<option value="${esc(r.id)}">${esc(r.label || r.id)} · v${esc(engOf(r))}${r.trigger === "manual" ? " · manual" : ""}</option>`).join("");
    sel.disabled = false;
    const mine = S.myCycle && S.runs.find(r => r.cycle_id === S.myCycle);
    const keep = S.run && S.runs.find(r => r.id === S.run.id);
    const pick = mine || keep || S.runs[0];
    if (mine) S.myCycle = null;
    sel.value = pick.id;
    if (S.run && S.run.id === pick.id) { S.run = pick; render(); }   // same scan, fresher doc
    else selectRun(pick.id);
  }
  renderEngineNote(); renderControls();
}
function renderEngineNote() {
  const box = $("#enginenote");
  const v = S.engine === "all" ? (S.run ? engOf(S.run) : null) : S.engine;
  const e = v && engineList().find(x => x.version === v);
  if (!e || !(e.summary || e.released)) { box.hidden = true; return; }
  const ch = (e.changes || []).join(" · ");
  box.innerHTML = `<span class="enginechip">v${esc(e.version)}</span>${e.released ? `<span>released <b class="mono">${esc(e.released)}</b></span>` : ""}<span>${esc(e.summary || "")}</span>${ch && ch !== e.summary ? `<span>Changes: ${esc(ch)}</span>` : ""}`;
  box.hidden = false;
}

/* ---------- manual scan cycle ---------- */
function cycleBusy() {
  const c = S.cycle;
  if (!c || !ACTIVE.includes(c.status)) return false;
  return Date.now() - new Date(c.updated_at || c.requested_at).getTime() < 3 * 3600e3;   // stale after 3h
}
function runEngine() { return S.engine === "all" ? currentEngine() : S.engine; }
function renderControls() {
  const ctl = $("#runctl"); if (!ctl) return;
  const v = runEngine();
  if (!S.db || !S.canWrite) { ctl.innerHTML = `<button class="runbtn" disabled title="You can view this desk but not start scans">Run new scan</button>`; return; }
  if (!S.mcp) { ctl.innerHTML = `<button class="runbtn" disabled title="Starting a scan needs the Claude Code Remote connector, which this view cannot reach">Run new scan</button>`; return; }
  if (cycleBusy() || S.busy) { ctl.innerHTML = `<button class="runbtn" disabled>Scan running…</button>`; return; }
  ctl.innerHTML = S.arm
    ? `<button class="runbtn" id="rungo">Run engine v${esc(v)} now</button><button class="runbtn ghost" id="runcancel">Cancel</button>`
    : `<button class="runbtn" id="runscan" title="Scan today's market with engine v${esc(v)}, then review and publish new pairs here">Run new scan · v${esc(v)}</button>`;
}
const STATUS = { requested: "Requested, waiting for Claude to start", scanning: "Scanning the market on GitHub", reviewing: "Reading charts and pairing",
  published: "Published", failed: "Failed" };
function renderCycle() {
  const box = $("#cycle"), c = S.cycle;
  if (!c) { box.hidden = true; return; }
  const age = Date.now() - new Date(c.updated_at || c.requested_at).getTime();
  const live = ACTIVE.includes(c.status) && age < 3 * 3600e3;
  if (!live && age > 36 * 3600e3) { box.hidden = true; return; }   // old news
  const t = d => d ? new Date(d).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "";
  const stale = ACTIVE.includes(c.status) && !live;
  box.className = "cycle" + (live ? " live" : c.status === "published" ? " done" : (c.status === "failed" || stale) ? " failed" : "");
  box.innerHTML = `<span class="dot"></span><b>Scan cycle</b><span class="enginechip">v${esc(c.engine || "?")}</span>
    <span>${esc(stale ? "No progress for 3 hours; it probably stopped" : (STATUS[c.status] || c.status))}${c.message ? ": " + esc(c.message) : ""}</span>
    <span class="lbl">started ${esc(t(c.requested_at))}${c.status === "published" && c.updated_at ? " · done " + esc(t(c.updated_at)) : ""}</span>
    ${c.status === "published" && c.run_id ? `<button class="x" data-open="${esc(c.run_id)}">Open this scan</button>` : ""}`;
  box.hidden = false;
}
async function startCycle() {
  const v = runEngine();
  const now = new Date();
  const id = "c-" + now.toISOString().replace(/[-:T]/g, "").slice(0, 14);
  S.busy = true; S.arm = false; renderControls();
  const ref = S.db.collection("cycles").doc(id);
  try {
    await ref.set({ cycle_id: id, engine: v, status: "requested", requested_at: now.toISOString(),
      updated_at: now.toISOString(), requested_by: S.uid || null });
  } catch (err) {
    S.busy = false; renderControls();
    showBanner("The scan request did not save, so nothing was started. Check your connection and press Run new scan again.");
    return;
  }
  try {
    await S.mcp.callTool("Claude Code Remote", "fire_trigger",
      { trigger_id: REVIEW_TASK, text: `MANUAL CYCLE cycle_id=${id} engine=${v}` }, { cache: false });
    S.myCycle = id;
    showBanner("");
  } catch (err) {
    const why = {
      needs_reauth: "Reconnect Claude Code Remote in your claude.ai connector settings, then press Run new scan again.",
      server_not_connected: "Claude Code Remote is not connected for this page. Allow it when the page asks, then try again.",
      not_granted: "This page was not allowed to use Claude Code Remote. Allow it from the page's Permissions menu, then try again.",
      consent_required: "Allow this page to use Claude Code Remote, then press Run new scan again.",
      rate_limited: "Too many requests just now. Wait a minute and press Run new scan again.",
    }[err?.code] || `The scan could not start (${esc(err?.code || "unknown error")}${err?.message ? ": " + esc(err.message) : ""}).`;
    try { await ref.update({ status: "failed", message: "could not start the review task", updated_at: new Date().toISOString() }); } catch (e2) {}
    showBanner(why);
  }
  S.busy = false; renderControls();
}

function selectRun(id) {
  S.run = S.runs.find(r => r.id === id);
  if (!S.run) return;
  renderEngineNote();
  S.decisions = {};
  if (S.unsub) S.unsub();
  S.unsub = S.db.collection("decisions").where("run_id", "==", id).onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { m[d.id] = d.data(); });
    S.decisions = m;
    render();
  }, err => showBanner("Live decision updates stopped. Reload to reconnect."));
  S.chartfb = {};
  if (S.unsub2) S.unsub2();
  S.unsub2 = S.db.collection("chart_feedback").where("run_id", "==", id).onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const x = d.data(); m[`${x.symbol}|${x.side}`] = x.verdict; });
    S.chartfb = m;
    render();
  }, err => {});
  render();
}

/* ---------- render ---------- */
function renderEmpty(html) {
  $("#pairs").innerHTML = `<div class="empty">${html}</div>`;
}

function render() {
  const r = S.run; if (!r) return;
  const cands = r.candidates || [], pairs = r.pairs || [];
  $("#facts").innerHTML = [
    `Engine <b class="mono">v${esc(engOf(r))}</b>${r.trigger === "manual" ? " · manual run" : ""}`,
    `Scanned <b class="mono">${esc((r.run_utc || "").slice(0, 16).replace("T", " "))} UTC</b>`,
    `Universe <b class="mono">${esc(r.universe_count)}</b> US stocks over $2bn`,
    `Charts reviewed <b class="mono">${cands.length}</b>`,
    `Hold window to <b class="mono">${esc(r.hold_until || "–")}</b>`,
  ].map(x => `<span>${x}</span>`).join("");
  $("#note").textContent = r.market_note || "";
  const taken = pairs.filter(p => decisionOf(p)?.action === "take").length;
  $("#c-pairs").textContent = pairs.length;
  $("#c-charts").textContent = cands.length;
  $("#c-book").textContent = taken;
  $("#c-track").textContent = (r.track_record || []).filter(x => x.ret5 != null).length || "";
  for (const t of ["pairs", "charts", "book", "track", "learn"]) {
    $("#tab-" + t).setAttribute("aria-selected", String(S.tab === t));
    $("#view-" + t).hidden = S.tab !== t;
  }
  if (S.tab === "pairs") renderPairs(r);
  if (S.tab === "charts") renderCharts(r);
  if (S.tab === "book") renderBook(r);
  if (S.tab === "track") renderTrack(r);
  if (S.tab === "learn") renderLearn(r);
  if (!S.canWrite) showBanner("You can view this desk but not record decisions.");
}

const pid = p => `${S.run.id}__${p.long.symbol}-${p.short.symbol}`;
const decisionOf = p => S.decisions[pid(p)];

function renderPairs(r) {
  const sectors = ["All", ...new Set((r.pairs || []).map(p => p.supersector))];
  $("#pairfilters").innerHTML =
    sectors.map(s => `<button class="chip" data-f="sector" data-v="${esc(s)}" aria-pressed="${S.fSector === s}">${esc(s)}</button>`).join("") +
    `<span class="sep"></span>` +
    [[0, "Any conviction"], [3, "3+"], [4, "4+"]].map(([v, l]) => `<button class="chip" data-f="conv" data-v="${v}" aria-pressed="${S.fConv === v}">${l}</button>`).join("") +
    `<span class="sep"></span><button class="chip" data-f="hide" aria-pressed="${S.fHide}">Hide passed</button>`;
  let list = (r.pairs || []).filter(p => (S.fSector === "All" || p.supersector === S.fSector) && p.conviction >= S.fConv);
  if (S.fHide) list = list.filter(p => decisionOf(p)?.action !== "pass");
  $("#pairs").innerHTML = list.length ? list.map(ticket).join("") : `<div class="empty">No pairs match these filters.</div>`;

const TAGNAME = { S1: "21D thrust ahead of 50D/200D", S2: "Momentum pullback (3M leader, 21D/50D diverging)", S3: "Smooth approach to the 200D",
  MOM: "Top/bottom of sector on 1W/1M/3M", LEAD: "RS line crossed its 40W MA before price crossed its 40W", SECT: "Just turned Leading/Lagging vs its sector",
  BO: "3M/6M range breakout or breakdown", MACD: "MACD histogram flip or turn" };
function badges(l) {
  const rg = l.regime || "";
  const rc = rg === "Uptrend" ? "up" : rg === "Downtrend" ? "dn" : rg.startsWith("Turning") ? "turn" : "";
  const ss = l.sector_state || "";
  const sc = ss === "Leading" ? "up" : ss === "Lagging" ? "dn" : ss ? "turn" : "";
  const st = l.sector_turn === 1 ? " · just turned" : l.sector_turn === -1 ? " · just turned" : "";
  const extra = [];
  if (l.rs_lead) extra.push(`<span class="bdg turn">RS leads price</span>`);
  if (l.breakout) extra.push(`<span class="bdg ${l.breakout > 0 ? "up" : "dn"}">${Math.abs(l.breakout) >= 1.5 ? "6M" : "3M"} ${l.breakout > 0 ? "breakout" : "breakdown"}${Math.abs(l.breakout) % 1 === 0.5 ? " on volume" : ""}</span>`);
  if (l.macd_sig) extra.push(`<span class="bdg ${l.macd_sig > 0 ? "up" : "dn"}">MACD ${Math.abs(l.macd_sig) === 1 ? "flip" : "turn"}</span>`);
  return `<div class="badges">${rg ? `<span class="bdg ${rc}" title="Weekly picture">W: ${esc(rg)}</span>` : ""}${ss ? `<span class="bdg ${sc}" title="vs its sector ETF">Sector: ${esc(ss)}${st}</span>` : ""}${l.family ? `<span class="bdg">${esc(l.family)}</span>` : ""}${extra.join("")}</div>`;
}
function fbRow(sym, side) {
  const v = S.chartfb[`${sym}|${side}`] || "";
  const dis = S.canWrite ? "" : "disabled";
  return `<div class="fbrow"><span>This chart:</span><button class="fb" data-sym="${esc(sym)}" data-side="${side}" data-v="good" aria-pressed="${v === "good"}" ${dis}>Good</button><button class="fb" data-sym="${esc(sym)}" data-side="${side}" data-v="bad" aria-pressed="${v === "bad"}" ${dis}>Bad</button></div>`;
}

    <p class="read">${esc(l.read)}</p>
    ${badges(l)}

    <div class="stats mono">
      <div><span>d21</span>${pct(s.d21)}</div><div><span>d50</span>${pct(s.d50)}</div><div><span>d200</span>${pct(s.d200)}</div>
      <div><span>1M</span>${pct(s.p1m)}</div><div><span>3M</span>${pct(s.p3m)}</div><div><span>6M</span>${pct(s.p6m)}</div>
      <div><span title="RS vs S&amp;P against its 40W MA">RS/MA</span>${pct(s.rs_ma)}</div><div><span title="RS vs sector ETF against its 40W MA">Sec/MA</span>${pct(s.rssec_ma)}</div><div><span>Vol</span><span>${s.vol == null ? "–" : Math.round(s.vol) + "%"}</span></div>

  const reasons = REASONS[a] || [];
  const dis = S.canWrite ? "" : "disabled";
  return `<article class="ticket ${a === "pass" ? "is-pass" : ""}" data-id="${esc(id)}">
    <div class="thead">
      <span class="sector">${esc(p.supersector)}</span>
      <span class="badge">${p.type === "industry" ? "Same industry" : "Same sector"}</span>
      ${a ? `<span class="status ${a}">${a}</span>` : ""}
      <span class="pips" title="Conviction ${p.conviction} of 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= p.conviction ? "on" : ""}"></i>`).join("")}</span>
    </div>
    <p class="thesis">${esc(p.thesis)}</p>
    <div class="legs">${leg(p.long, "long")}${leg(p.short, "short")}</div>
    <div class="pairstats mono">
      <span>Corr 60D <b>${p.corr60 ?? "–"}</b></span>
      <span>Vol ratio L/S <b>${p.vol_ratio ?? "–"}</b></span>
      <span>Vol-balanced split <b>${p.split_long ?? "–"} / ${p.split_short ?? "–"}</b></span>
    </div>
    <div class="decide">
      ${["take", "watch", "pass"].map(x => `<button class="act" data-a="${x}" aria-pressed="${a === x}" ${dis}>${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}
      ${reasons.length ? `<select data-k="reason" aria-label="Reason" ${dis}><option value="">Reason…</option>${reasons.map(x => `<option ${d.reason === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>` : ""}
      ${a ? `<input data-k="note" placeholder="Note" value="${esc(d.note || "")}" aria-label="Note" ${dis}>` : ""}
      <span class="saved">${d.decided_at ? "Saved " + new Date(d.decided_at).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" }) : ""}</span>

}

function renderCharts(r) {
  const c = r.candidates || [];
  $("#chartfilters").innerHTML =
    [["all", "Both sides"], ["long", "Longs"], ["short", "Shorts"]].map(([v, l]) => `<button class="chip" data-f="gside" data-v="${v}" aria-pressed="${S.gSide === v}">${l}</button>`).join("") +
    `<span class="sep"></span>` +
    [["all", "All grades"], ["A", "A"], ["AB", "A + B"]].map(([v, l]) => `<button class="chip" data-f="ggrade" data-v="${v}" aria-pressed="${S.gGrade === v}">${l}</button>`).join("");
  const keep = x => (S.gSide === "all" || x.side === S.gSide) &&
    (S.gGrade === "all" || (S.gGrade === "A" ? x.grade === "A" : ["A", "B"].includes(x.grade)));
  const bySector = {};
  c.filter(keep).forEach(x => (bySector[x.supersector] ||= []).push(x));
  const keys = Object.keys(bySector).sort();
  $("#charts").innerHTML = keys.length ? keys.map(s => `<div class="sectorblock"><h2>${esc(s)} <span class="count">${bySector[s].length}</span></h2><div class="gal">${
    bySector[s].map(x => `<div class="card">
      <div class="legtop"><span class="side ${x.side}">${x.side}</span><span class="tkr" style="font-size:15px">${esc(x.symbol)}</span><span class="grade">${esc(x.grade || "–")}</span>
        <span class="tags" style="margin-left:auto">${(x.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</span></div>
      ${x.chart_url ? `<button class="thumb" data-zoom="${esc(x.symbol)}|${x.side}" aria-label="Open ${esc(x.symbol)} chart"><img src="${esc(x.chart_url)}" alt="${esc(x.symbol)} daily chart" loading="lazy"></button>` : ""}
      ${badges(x)}

      ${fbRow(x.symbol, x.side)}
    </div>`).join("")}</div></div>`).join("") : `<div class="empty">No charts match these filters.</div>`;
}

function renderBook(r) {
  const pairs = r.pairs || [];
  const taken = pairs.filter(p => decisionOf(p)?.action === "take");
  const watch = pairs.filter(p => decisionOf(p)?.action === "watch");
  const passed = pairs.filter(p => decisionOf(p)?.action === "pass");
  const lines = taken.map(p => `LONG ${p.long.symbol} / SHORT ${p.short.symbol}`).join("\n");
  const row = p => { const d = decisionOf(p) || {}; return `<tr><td class="mono">${esc(p.long.symbol)}</td><td class="mono">${esc(p.short.symbol)}</td><td>${esc(p.supersector)}</td><td class="mono">${p.conviction}</td><td>${esc(d.reason || "")}${d.note ? " · " + esc(d.note) : ""}</td></tr>`; };
  const table = (title, list) => `<div><div class="lbl" style="margin-bottom:6px">${title} · ${list.length}</div>${list.length ? `<div class="tablebox"><table><thead><tr><th>Long</th><th>Short</th><th>Sector</th><th>Conv.</th><th>Reason / note</th></tr></thead><tbody>${list.map(row).join("")}</tbody></table></div>` : `<div class="empty">None yet.</div>`}</div>`;
  $("#book").innerHTML = `
    <div class="copyrow"><span><b class="mono">${taken.length}</b> of 10 pairs taken for this week's book</span>${taken.length ? `<button class="btn" id="copybook">Copy for SCREEN</button>` : ""}</div>
    ${taken.length ? `<textarea class="copyout" id="bookout" readonly>${esc(lines)}</textarea>` : ""}
    ${table("Taken", taken)}${table("Watching", watch)}${table("Passed", passed)}`;
}

/* ---------- interactions ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; try { localStorage.setItem("desk.tab", S.tab); } catch (err) {} render(); return; }
  const f = e.target.closest("[data-f]");
  if (f) {
    const v = f.dataset.v;
    if (f.dataset.f === "sector") S.fSector = v;
    if (f.dataset.f === "conv") S.fConv = Number(v);
    if (f.dataset.f === "hide") S.fHide = !S.fHide;
    if (f.dataset.f === "gside") S.gSide = v;
    if (f.dataset.f === "ggrade") S.gGrade = v;
    render(); return;
  }
  const z = e.target.closest("[data-zoom]");
  if (z) { openZoom(z.dataset.zoom); return; }
  const fb = e.target.closest(".fb");
  if (fb) { await saveFb(fb.dataset.sym, fb.dataset.side, fb.dataset.v); return; }
  const act = e.target.closest(".act");
  if (act) { const t = act.closest(".ticket"); const cur = S.decisions[t.dataset.id]?.action; await save(t.dataset.id, { action: cur === act.dataset.a ? null : act.dataset.a, reason: "", note: S.decisions[t.dataset.id]?.note || "" }); return; }
  if (e.target.id === "copybook") {
    const ta = $("#bookout");
    try { await navigator.clipboard.writeText(ta.value); e.target.textContent = "Copied"; }
    catch (err) { ta.focus(); ta.select(); e.target.textContent = "Selected: press Ctrl+C"; }
    return;
  }
  if (e.target.id === "lbclose") $("#lb").close();
  if (e.target.id === "runscan") { S.arm = true; renderControls(); $("#rungo")?.focus(); return; }
  if (e.target.id === "runcancel") { S.arm = false; renderControls(); return; }
  if (e.target.id === "rungo") { await startCycle(); return; }
  const op = e.target.closest("[data-open]");
  if (op) {
    const r = S.allRuns.find(x => x.id === op.dataset.open);
    if (r) {
      if (S.engine !== "all" && engOf(r) !== S.engine) S.engine = "all";
      S.run = r; applyRuns();
      $("#run").value = r.id; selectRun(r.id);
    }
    return;
  }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.k; if (!k) return;
  const t = e.target.closest(".ticket"); const d = S.decisions[t.dataset.id] || {};
  save(t.dataset.id, { ...d, [k]: e.target.value });
});
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") $("#lb").close(); });

async function save(id, patch) {
  if (!S.canWrite || !S.db) return;
  const p = (S.run.pairs || []).find(x => pid(x) === id);
  const ref = S.db.collection("decisions").doc(id);
  try {
    if (!patch.action) { await ref.delete(); return; }
    await ref.set({ run_id: S.run.id, long: p.long.symbol, short: p.short.symbol, supersector: p.supersector,
      conviction: p.conviction, action: patch.action, reason: patch.reason || "", note: patch.note || "",
      decided_at: new Date().toISOString(), decided_by: S.uid || null });
  } catch (err) {
    if (err?.code === "invalid_argument") { S.canWrite = false; render(); }
    else showBanner("That decision did not save. Check your connection and click it again.");
  }
}

async function saveFb(sym, side, v) {
  if (!S.canWrite || !S.db) return;
  const ref = S.db.collection("chart_feedback").doc(`${S.run.id}__${sym}-${side}`);
  try {
    if (S.chartfb[`${sym}|${side}`] === v) { await ref.delete(); return; }
    await ref.set({ run_id: S.run.id, symbol: sym, side, verdict: v, decided_at: new Date().toISOString(), decided_by: S.uid || null });
  } catch (err) {
    if (err?.code === "invalid_argument") { S.canWrite = false; render(); }
    else showBanner("That chart rating did not save. Click it again.");
  }
}

  rssec_vs_ma: "RS vs sector above 40W MA", rssec_cross: "Sector RS crossed its MA", rssec_hl: "Sector RS new high/low", rssec_1m: "1M vs sector", rssec_3m: "3M vs sector",
  sec_ratio: "Sector relative trend", sec_mom: "Sector relative momentum", sec_quad: "Sector state", sec_turn: "Just turned Leading/Lagging",
  w_d40: "Price vs 40W MA", w_slope40: "40W MA slope", w_10gt40: "10W above 40W", p1w: "1W", p1m: "1M", p3m: "3M", p6m: "6M",
  d21: "Price vs 21D", d50: "Price vs 50D", d200: "Price vs 200D", breakout: "3M/6M breakout", macd_sig: "MACD flip/turn", headroom: "Room to 6M level",

const fname = k => FNAME[k] || (k.startsWith("tag_") ? "Setup " + k.slice(4) : k);

function renderTrack(r) {
  const tr = (r.track_record || []).slice().reverse();
  const done = tr.filter(x => x.ret5 != null);
  const grp = k => { const g = done.filter(x => (k === "all" ? true : x.decision === k)); const n = g.length;
    return { n, avg: n ? g.reduce((a, x) => a + x.ret5, 0) / n : null, hit: n ? g.filter(x => x.ret5 > 0).length / n : null }; };
  const kp = (label, g) => `<div class="kpi"><span class="lbl">${label}</span><b>${g.avg == null ? "–" : (g.avg >= 0 ? "+" : "") + g.avg.toFixed(2) + "%"}</b><span class="lbl">${g.n} pairs · ${g.hit == null ? "–" : Math.round(g.hit * 100) + "% positive"}</span></div>`;
  $("#track").innerHTML = done.length ? `
    <p class="note">Average 1-week pair return (vol-balanced split, close to close from the scan date). This is the market's verdict on the desk and on your calls; it feeds the learner.</p>
    <div class="kpis">${kp("Taken", grp("take"))}${kp("Passed", grp("pass"))}${kp("Watched", grp("watch"))}${kp("All published", grp("all"))}</div>
    <div class="tablebox"><table><thead><tr><th>Scan</th><th>Long</th><th>Short</th><th>Conv.</th><th>Your call</th><th>1W</th><th>2W</th></tr></thead><tbody>
      ${tr.map(x => `<tr><td class="mono">${esc(x.run)}</td><td class="mono">${esc(x.long)}</td><td class="mono">${esc(x.short)}</td><td class="mono">${x.conviction ?? "–"}</td><td>${esc(x.decision)}</td><td class="mono">${fmtp(x.ret5)}</td><td class="mono">${fmtp(x.ret10)}</td></tr>`).join("")}
    </tbody></table></div>`
    : `<div class="empty"><b>No results yet.</b> Each pair published here is scored one and two weeks later against what actually happened. The first results appear the week after this scan's hold period ends.</div>`;
}

function renderLearn(r) {
  const m = r.model || {};
  const sides = m.sides || {};
  const pref = m.preference || {};
  const icRow = (side) => { const x = sides[side]; if (!x) return ""; const h = x.holdout_ic || {};
    return `<tr><td>${side}</td><td class="mono">${x.n_dates ?? "–"} weeks · ${(x.n_rows ?? 0).toLocaleString()} rows</td><td class="mono">${h.prior ?? "–"}</td><td class="mono">${h.current ?? "–"}</td><td class="mono">${h.fitted ?? "–"}</td><td class="mono"><b>${h.adopted ?? "–"}</b></td><td>${x.adopted ? "Updated" : "Kept"}</td></tr>`; };
  const evid = side => { const f = (sides[side] || {}).top_feature_ic || {}; const vals = Object.values(f).map(Math.abs); const mx = Math.max(0.01, ...vals);
    return Object.entries(f).map(([k, v]) => `<tr><td>${esc(fname(k))}</td><td class="mono">${v >= 0 ? "+" : ""}${v.toFixed(3)}</td><td><div class="bar"><i style="left:${v >= 0 ? 50 : 50 - Math.abs(v) / mx * 50}%;width:${Math.abs(v) / mx * 50}%;background:var(${v >= 0 ? "--long" : "--short"})"></i></div></td></tr>`).join(""); };
  const chg = side => Object.entries((sides[side] || {}).changes || {}).map(([k, v]) => `${esc(fname(k))} ${v >= 0 ? "+" : ""}${v.toFixed(3)}`).join(", ") || "none";
  const likes = o => Object.keys(o || {}).map(fname).map(esc).join(", ") || "–";
  $("#learn").innerHTML = `
    <p>Two teachers update the ranking every Saturday. <b>The market:</b> every past week in the price history is replayed through the same rules, and the model learns which signals preceded 1-week outperformance against the sector ETF. New weights are only adopted if they beat the current ones on the most recent 30% of weeks, and each weight moves at most a little per week. <b>You:</b> your Take / Pass calls and Good / Bad chart ratings train a second model of your eye. Its share of the ranking grows as you rate more.</p>
    <div class="kpis">
      <div class="kpi"><span class="lbl">Weights in use</span><b>${esc(m.weights_source || "prior")}</b><span class="lbl">trained ${esc((m.trained_at || "").slice(0, 10) || "–")}</span></div>
      <div class="kpi"><span class="lbl">Your ratings matched</span><b>${pref.n_matched ?? pref.n_labels ?? 0}</b><span class="lbl">switches on at 30</span></div>
      <div class="kpi"><span class="lbl">Your model's share</span><b>${Math.round((pref.beta || 0) * 100)}%</b><span class="lbl">of the final ranking</span></div>
    </div>
    <div><div class="lbl" style="margin-bottom:6px">Out-of-sample skill (rank IC of score vs 1-week sector-relative return; 0 = none)</div>
      <div class="tablebox"><table><thead><tr><th>Side</th><th>History</th><th>Prior</th><th>Last week</th><th>Fitted</th><th>In use</th><th></th></tr></thead><tbody>${icRow("long")}${icRow("short")}</tbody></table></div>
      <p class="lbl" style="margin-top:6px">This week's changes · long: ${chg("long")} · short: ${chg("short")}</p></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr))">
      ${["long", "short"].map(s => `<div><div class="lbl" style="margin-bottom:6px">What has worked for ${s}s</div><div class="tablebox"><table><tbody>${evid(s)}</tbody></table></div></div>`).join("")}
    </div>
    ${pref.beta ? `<div><div class="lbl" style="margin-bottom:6px">Your eye so far</div><p>You lean towards: ${likes(pref.top_likes)}.</p><p>You lean against: ${likes(pref.top_dislikes)}.</p></div>` : `<div class="empty">Your model switches on after 30 rated legs. Pass reasons that name a leg and Good / Bad on charts count the most.</div>`}
    <p class="lbl">${esc(m.note || "")}</p>`;
}

function openZoom(key) {
  const [sym, side] = key.split("|");
  const x = (S.run.candidates || []).find(c => c.symbol === sym && c.side === side);
  if (!x) return;
  $("#lbimg").src = x.chart_url; $("#lbimg").alt = sym + " daily chart";
  $("#lbtitle").textContent = `${side.toUpperCase()} ${sym} · ${x.company} · grade ${x.grade || "–"}`;
  $("#lbread").textContent = x.read || "";
  $("#lb").showModal();
}
</script>
